
name: DocOps Notion Automation

on:
  push:
    tags:
      - 'v*-stable-*'

jobs:
  docops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install notion-client

      - name: Run DocOps Script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python docops/docops_notion.py --tag ${{ github.ref_name }} --commit ${{ github.sha }}
